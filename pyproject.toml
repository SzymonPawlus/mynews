[project]
name = "mynews"
version = "0.1.0"
description = "Personalized daily news briefing synthesized by Claude"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "rapidfuzz>=3.9",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "numpy>=2.4.6",
]

[project.scripts]
mynews = "mynews.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
